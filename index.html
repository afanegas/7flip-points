<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7Flip Punktezähler</title>
<style>
  :root {
    --bg: #F4F1EA;
    --ink: #1E1B16;
    --ink-soft: #6B6355;
    --line: #DAD3C4;
    --card: #FFFFFF;
    --accent: #C0392B;
    --accent-soft: #F3D9D5;
    --gold: #B8862E;
    --gold-soft: #F1E4C8;
    --danger: #C0392B;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  h1 span { color: var(--accent); }
  .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .setup-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .player-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .player-row input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
  }
  .player-row input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 8px;
    font-size: 18px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn.remove { color: var(--danger); }
  .add-player-btn {
    width: 100%;
    padding: 10px;
    border: 1px dashed var(--line);
    background: transparent;
    border-radius: 8px;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  .primary-btn {
    width: 100%;
    padding: 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled {
    background: var(--line);
    color: var(--ink-soft);
  }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }

  /* Scoreboard */
  .scoreboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .player-score {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .player-score.leader {
    border-color: var(--gold);
    background: var(--gold-soft);
  }
  .ps-name {
    font-weight: 600;
    font-size: 15px;
  }
  .ps-total-wrap {
    text-align: right;
  }
  .ps-total {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .ps-label {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: lowercase;
  }

  .round-entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .round-entry-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .round-badge {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .score-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .score-input-row:last-of-type { border-bottom: none; }
  .sir-name {
    flex: 1;
    font-size: 15px;
  }
  .sir-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stepper-btn {
    width: 34px;
    height: 34px;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 8px;
    font-size: 18px;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .stepper-btn:active { transform: scale(0.92); }
  .sir-input {
    width: 56px;
    text-align: center;
    padding: 8px 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    background: var(--bg);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .sir-input:focus { outline: none; border-color: var(--accent); }

  .history-toggle {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 10px 0;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .history-table th, .history-table td {
    padding: 6px 8px;
    text-align: right;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .history-table th:first-child, .history-table td:first-child {
    text-align: left;
  }
  .history-table th {
    color: var(--ink-soft);
    font-weight: 500;
  }
  .history-table tfoot td {
    font-weight: 700;
    border-bottom: none;
    border-top: 2px solid var(--line);
  }
  .history-table tbody tr {
    cursor: pointer;
  }
  .history-table tbody tr:active {
    background: var(--bg);
  }
  .history-table td.round-num {
    color: var(--ink-soft);
  }
  .history-table td.round-num .edit-hint {
    font-size: 10px;
    display: block;
  }
  .edit-round-list {
    max-height: 300px;
    overflow-y: auto;
  }
  .modal-box.wide { max-width: 400px; }
  .modal-box .score-input-row:first-of-type { margin-top: 4px; }

  .footer-actions {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    padding: 20px 16px 16px;
  }
  .footer-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  .secondary-btn {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .footer-actions .primary-btn { flex: 2; margin-top: 0; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
  }

  .winner-banner {
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .winner-banner .trophy { font-size: 22px; }
  .hidden { display: none !important; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30,27,22,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-box {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    max-width: 340px;
    width: 100%;
  }
  .modal-box p { font-size: 14px; margin: 0 0 16px; }
  .modal-actions { display: flex; gap: 8px; }

  .leaderboard-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .leaderboard-row:last-child { border-bottom: none; }
  .lb-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lb-rank {
    width: 22px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .lb-name {
    font-size: 15px;
    font-weight: 600;
  }
  .lb-wins {
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .lb-wins-label {
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 400;
    margin-left: 4px;
  }
  .lb-empty {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    padding: 8px 0;
  }
  .lb-reset {
    width: 100%;
    text-align: center;
    background: transparent;
    border: none;
    padding: 10px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    text-decoration: underline;
  }
  .end-game-btn {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--gold);
    background: var(--gold-soft);
    color: #6B4E17;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>7<span>Flip</span></h1>
  </header>
  <div class="sub">Punktezähler</div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen">
    <div class="card" id="leaderboard-card">
      <p class="setup-title">Bestenliste</p>
      <div id="leaderboard-content"></div>
    </div>
    <div class="card">
      <p class="setup-title">Wer spielt mit?</p>
      <div id="player-list"></div>
      <button class="add-player-btn" id="add-player-btn">+ Spieler hinzufügen</button>
      <button class="primary-btn" id="start-game-btn">Spiel starten</button>
      <div class="hint">2 bis 8 Spieler. Höchste Gesamtpunktzahl gewinnt (200 Punkte).</div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <div id="winner-banner-slot"></div>
    <div class="scoreboard" id="scoreboard"></div>

    <div id="end-game-slot"></div>

    <div class="round-entry">
      <p class="round-entry-title">
        Runde <span id="current-round-num">1</span> eintragen
        <span class="round-badge" id="rounds-played-badge">0 Runden gespielt</span>
      </p>
      <div id="score-inputs"></div>
      <button class="primary-btn" id="submit-round-btn">Runde speichern</button>
    </div>

    <div class="card" id="history-card" style="margin-top:16px;">
      <button class="history-toggle" id="history-toggle-btn">▾ Rundenverlauf anzeigen</button>
      <div id="history-content" class="hidden"></div>
    </div>
  </div>
</div>

<div class="footer-actions hidden" id="footer-actions">
  <div class="footer-inner">
    <button class="secondary-btn" id="new-game-btn">Neues Spiel</button>
  </div>
</div>

<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <p id="confirm-text">Bist du sicher?</p>
    <div class="modal-actions">
      <button class="secondary-btn" id="confirm-cancel">Abbrechen</button>
      <button class="primary-btn" id="confirm-ok" style="margin-top:0;">Bestätigen</button>
    </div>
  </div>
</div>

<div id="edit-round-modal" class="modal-overlay hidden">
  <div class="modal-box wide">
    <p class="setup-title" style="margin-bottom:14px;">Runde <span id="edit-round-num"></span> korrigieren</p>
    <div id="edit-round-inputs"></div>
    <div class="modal-actions" style="margin-top:16px;">
      <button class="secondary-btn" id="edit-round-delete" style="color:var(--danger);">Runde löschen</button>
      <button class="primary-btn" id="edit-round-save" style="margin-top:0;">Speichern</button>
    </div>
    <button class="secondary-btn" id="edit-round-cancel" style="width:100%; margin-top:8px;">Abbrechen</button>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = '7flip-scoreboard-state';
  const WINS_KEY = '7flip-wins';

  let state = loadState() || {
    screen: 'setup',
    players: ['', ''],
    rounds: [] // array of arrays, one entry per player per round
  };

  let wins = loadWins() || {}; // { playerName: winCount }

  function loadWins() {
    try {
      const raw = localStorage.getItem(WINS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) {
      return null;
    }
  }

  function saveWins() {
    try {
      localStorage.setItem(WINS_KEY, JSON.stringify(wins));
    } catch(e) {}
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) {
      return null;
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e) {}
  }

  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');
  const footerActions = document.getElementById('footer-actions');
  const playerListEl = document.getElementById('player-list');
  const addPlayerBtn = document.getElementById('add-player-btn');
  const startGameBtn = document.getElementById('start-game-btn');

  function renderLeaderboard() {
    const entries = Object.entries(wins).sort((a, b) => b[1] - a[1]);
    const content = document.getElementById('leaderboard-content');
    if (entries.length === 0) {
      content.innerHTML = '<div class="lb-empty">Noch keine beendeten Spiele.</div>';
      return;
    }
    let html = '';
    entries.forEach(([name, count], i) => {
      html += `
        <div class="leaderboard-row">
          <div class="lb-left">
            <span class="lb-rank">${i + 1}</span>
            <span class="lb-name">${escapeHtml(name)}</span>
          </div>
          <span class="lb-wins">${count}<span class="lb-wins-label">${count === 1 ? 'Sieg' : 'Siege'}</span></span>
        </div>
      `;
    });
    html += '<button class="lb-reset" id="lb-reset-btn">Bestenliste zurücksetzen</button>';
    content.innerHTML = html;
    document.getElementById('lb-reset-btn').addEventListener('click', () => {
      showConfirm('Bestenliste wirklich zurücksetzen? Alle gespeicherten Siege gehen verloren.', () => {
        wins = {};
        saveWins();
        renderLeaderboard();
      });
    });
  }

  function renderSetup() {
    playerListEl.innerHTML = '';
    state.players.forEach((name, i) => {
      const row = document.createElement('div');
      row.className = 'player-row';
      row.innerHTML = `
        <input type="text" placeholder="Spieler ${i+1}" value="${escapeHtml(name)}" data-idx="${i}" maxlength="20">
        <button class="icon-btn remove" data-idx="${i}" ${state.players.length <= 2 ? 'style="visibility:hidden"' : ''}>&times;</button>
      `;
      playerListEl.appendChild(row);
    });

    playerListEl.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', (e) => {
        state.players[+e.target.dataset.idx] = e.target.value;
        saveState();
      });
    });
    playerListEl.querySelectorAll('.icon-btn.remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = +e.target.dataset.idx;
        state.players.splice(idx, 1);
        saveState();
        renderSetup();
      });
    });

    addPlayerBtn.style.display = state.players.length >= 8 ? 'none' : 'block';
    startGameBtn.disabled = state.players.length < 2;
  }

  addPlayerBtn.addEventListener('click', () => {
    if (state.players.length < 8) {
      state.players.push('');
      saveState();
      renderSetup();
    }
  });

  startGameBtn.addEventListener('click', () => {
    const names = state.players.map((n, i) => n.trim() || `Spieler ${i+1}`);
    if (names.length < 2) return;
    state.players = names;
    state.rounds = [];
    state.screen = 'game';
    saveState();
    render();
  });

  // ---- Game screen ----
  const scoreboardEl = document.getElementById('scoreboard');
  const scoreInputsEl = document.getElementById('score-inputs');
  const currentRoundNumEl = document.getElementById('current-round-num');
  const roundsPlayedBadge = document.getElementById('rounds-played-badge');
  const submitRoundBtn = document.getElementById('submit-round-btn');
  const historyToggleBtn = document.getElementById('history-toggle-btn');
  const historyContent = document.getElementById('history-content');
  const winnerSlot = document.getElementById('winner-banner-slot');
  const newGameBtn = document.getElementById('new-game-btn');

  let pendingScores = [];
  let historyOpen = false;

  function totals() {
    return state.players.map((_, pIdx) =>
      state.rounds.reduce((sum, round) => sum + (round[pIdx] || 0), 0)
    );
  }

  function renderScoreboard() {
    const t = totals();
    const maxTotal = state.rounds.length > 0 ? Math.max(...t) : null;
    scoreboardEl.innerHTML = '';
    state.players.forEach((name, i) => {
      const isLeader = state.rounds.length > 0 && t[i] === maxTotal;
      const div = document.createElement('div');
      div.className = 'player-score' + (isLeader ? ' leader' : '');
      div.innerHTML = `
        <span class="ps-name">${escapeHtml(name)}</span>
        <span class="ps-total-wrap">
          <div class="ps-total">${t[i]}</div>
          <div class="ps-label">Punkte</div>
        </span>
      `;
      scoreboardEl.appendChild(div);
    });
  }

  function renderScoreInputs() {
    pendingScores = state.players.map(() => 0);
    scoreInputsEl.innerHTML = '';
    state.players.forEach((name, i) => {
      const row = document.createElement('div');
      row.className = 'score-input-row';
      row.innerHTML = `
        <span class="sir-name">${escapeHtml(name)}</span>
        <div class="sir-controls">
          <button class="stepper-btn" data-idx="${i}" data-delta="-1">&minus;</button>
          <input class="sir-input" type="number" inputmode="numeric" value="0" data-idx="${i}">
          <button class="stepper-btn" data-idx="${i}" data-delta="1">+</button>
        </div>
      `;
      scoreInputsEl.appendChild(row);
    });

    scoreInputsEl.querySelectorAll('.stepper-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = +btn.dataset.idx;
        const delta = +btn.dataset.delta;
        pendingScores[idx] = (pendingScores[idx] || 0) + delta;
        const input = scoreInputsEl.querySelector(`.sir-input[data-idx="${idx}"]`);
        input.value = pendingScores[idx];
      });
    });
    scoreInputsEl.querySelectorAll('.sir-input').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = +e.target.dataset.idx;
        const val = parseInt(e.target.value, 10);
        pendingScores[idx] = isNaN(val) ? 0 : val;
      });
    });
  }

  submitRoundBtn.addEventListener('click', () => {
    state.rounds.push(pendingScores.slice());
    saveState();
    render();
  });

  function renderHistory() {
    if (state.rounds.length === 0) {
      historyContent.innerHTML = '<p class="hint" style="margin:8px 0 0;">Noch keine Runden gespielt.</p>';
      return;
    }
    const t = totals();
    let html = '<table class="history-table"><thead><tr><th>Runde</th>';
    state.players.forEach(name => { html += `<th>${escapeHtml(name)}</th>`; });
    html += '</tr></thead><tbody>';
    state.rounds.forEach((round, rIdx) => {
      html += `<tr data-round-idx="${rIdx}"><td class="round-num">${rIdx + 1}<span class="edit-hint">bearbeiten</span></td>`;
      round.forEach(score => { html += `<td>${score}</td>`; });
      html += '</tr>';
    });
    html += '</tbody><tfoot><tr><td>Gesamt</td>';
    t.forEach(total => { html += `<td>${total}</td>`; });
    html += '</tr></tfoot></table>';
    historyContent.innerHTML = html;

    historyContent.querySelectorAll('tbody tr').forEach(row => {
      row.addEventListener('click', () => {
        openEditRound(+row.dataset.roundIdx);
      });
    });
  }

  historyToggleBtn.addEventListener('click', () => {
    historyOpen = !historyOpen;
    historyContent.classList.toggle('hidden', !historyOpen);
    historyToggleBtn.textContent = (historyOpen ? '▴' : '▾') + ' Rundenverlauf ' + (historyOpen ? 'ausblenden' : 'anzeigen');
  });

  function renderWinnerBanner() {
    const t = totals();
    const maxTotal = t.length > 0 ? Math.max(...t) : 0;
    const endGameSlot = document.getElementById('end-game-slot');
    if (maxTotal >= 200) {
      const winners = state.players.filter((_, i) => t[i] === maxTotal);
      winnerSlot.innerHTML = `
        <div class="winner-banner">
          <span class="trophy">🏆</span>
          <span>${escapeHtml(winners.join(', '))} ${winners.length > 1 ? 'erreichen' : 'erreicht'} ${maxTotal} Punkte und ${winners.length > 1 ? 'gewinnen' : 'gewinnt'}!</span>
        </div>
      `;
      endGameSlot.innerHTML = '<button class="end-game-btn" id="end-game-btn">Spiel beenden und Sieg vermerken</button>';
    } else {
      winnerSlot.innerHTML = '';
      endGameSlot.innerHTML = '';
    }
  }

  function renderGame() {
    renderScoreboard();
    renderScoreInputs();
    currentRoundNumEl.textContent = state.rounds.length + 1;
    roundsPlayedBadge.textContent = state.rounds.length + (state.rounds.length === 1 ? ' Runde gespielt' : ' Runden gespielt');
    renderHistory();
    renderWinnerBanner();
    historyContent.classList.toggle('hidden', !historyOpen);
  }

  // ---- Generic confirm modal ----
  const modal = document.getElementById('confirm-modal');
  const confirmTextEl = document.getElementById('confirm-text');
  const confirmCancel = document.getElementById('confirm-cancel');
  const confirmOk = document.getElementById('confirm-ok');
  let confirmCallback = null;

  function showConfirm(text, onConfirm) {
    confirmTextEl.textContent = text;
    confirmCallback = onConfirm;
    modal.classList.remove('hidden');
  }

  confirmCancel.addEventListener('click', () => {
    modal.classList.add('hidden');
    confirmCallback = null;
  });
  confirmOk.addEventListener('click', () => {
    modal.classList.add('hidden');
    if (confirmCallback) confirmCallback();
    confirmCallback = null;
  });

  function currentWinners() {
    const t = totals();
    const maxTotal = t.length > 0 ? Math.max(...t) : 0;
    if (maxTotal < 200) return [];
    return state.players.filter((_, i) => t[i] === maxTotal);
  }

  function resetToSetup() {
    state = { screen: 'setup', players: ['', ''], rounds: [] };
    saveState();
    render();
  }

  newGameBtn.addEventListener('click', () => {
    const winners = currentWinners();
    if (winners.length > 0 && state.rounds.length > 0) {
      const label = winners.length > 1 ? winners.join(', ') + ' als Sieger' : winners[0] + ' als Sieger';
      showConfirm(`${label} in der Bestenliste vermerken und neues Spiel starten?`, () => {
        winners.forEach(name => {
          wins[name] = (wins[name] || 0) + 1;
        });
        saveWins();
        resetToSetup();
      });
    } else {
      showConfirm('Spiel wirklich beenden und neu starten? Der aktuelle Punktestand geht verloren.', resetToSetup);
    }
  });

  document.getElementById('end-game-slot').addEventListener('click', (e) => {
    if (e.target && e.target.id === 'end-game-btn') {
      const winners = currentWinners();
      const label = winners.length > 1 ? winners.join(', ') : winners[0];
      showConfirm(`${label} gewinnt mit ${Math.max(...totals())} Punkten. Sieg vermerken und Spiel beenden?`, () => {
        winners.forEach(name => {
          wins[name] = (wins[name] || 0) + 1;
        });
        saveWins();
        resetToSetup();
      });
    }
  });

  // ---- Edit round modal ----
  const editRoundModal = document.getElementById('edit-round-modal');
  const editRoundNum = document.getElementById('edit-round-num');
  const editRoundInputs = document.getElementById('edit-round-inputs');
  const editRoundSave = document.getElementById('edit-round-save');
  const editRoundDelete = document.getElementById('edit-round-delete');
  const editRoundCancel = document.getElementById('edit-round-cancel');
  let editingRoundIdx = null;
  let editingScores = [];

  function openEditRound(rIdx) {
    editingRoundIdx = rIdx;
    editingScores = state.rounds[rIdx].slice();
    editRoundNum.textContent = rIdx + 1;
    editRoundInputs.innerHTML = '';
    state.players.forEach((name, i) => {
      const row = document.createElement('div');
      row.className = 'score-input-row';
      row.innerHTML = `
        <span class="sir-name">${escapeHtml(name)}</span>
        <div class="sir-controls">
          <button class="stepper-btn" data-idx="${i}" data-delta="-1">&minus;</button>
          <input class="sir-input" type="number" inputmode="numeric" value="${editingScores[i] || 0}" data-idx="${i}">
          <button class="stepper-btn" data-idx="${i}" data-delta="1">+</button>
        </div>
      `;
      editRoundInputs.appendChild(row);
    });
    editRoundInputs.querySelectorAll('.stepper-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = +btn.dataset.idx;
        const delta = +btn.dataset.delta;
        editingScores[idx] = (editingScores[idx] || 0) + delta;
        editRoundInputs.querySelector(`.sir-input[data-idx="${idx}"]`).value = editingScores[idx];
      });
    });
    editRoundInputs.querySelectorAll('.sir-input').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = +e.target.dataset.idx;
        const val = parseInt(e.target.value, 10);
        editingScores[idx] = isNaN(val) ? 0 : val;
      });
    });
    editRoundModal.classList.remove('hidden');
  }

  editRoundSave.addEventListener('click', () => {
    if (editingRoundIdx === null) return;
    state.rounds[editingRoundIdx] = editingScores.slice();
    saveState();
    editRoundModal.classList.add('hidden');
    historyOpen = true;
    render();
    historyContent.classList.remove('hidden');
    historyToggleBtn.textContent = '▴ Rundenverlauf ausblenden';
  });

  editRoundDelete.addEventListener('click', () => {
    if (editingRoundIdx === null) return;
    state.rounds.splice(editingRoundIdx, 1);
    saveState();
    editRoundModal.classList.add('hidden');
    historyOpen = true;
    render();
    historyContent.classList.remove('hidden');
    historyToggleBtn.textContent = '▴ Rundenverlauf ausblenden';
  });

  editRoundCancel.addEventListener('click', () => {
    editRoundModal.classList.add('hidden');
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    if (state.screen === 'setup') {
      setupScreen.classList.remove('hidden');
      gameScreen.classList.add('hidden');
      footerActions.classList.add('hidden');
      renderSetup();
      renderLeaderboard();
    } else {
      setupScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      footerActions.classList.remove('hidden');
      renderGame();
    }
  }

  render();
})();
</script>
</body>
</html>
